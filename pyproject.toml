[project]
name = "dtasrl"
version = "0.1.0"
description = "Execution-consistent pathwise attribution of reinforcement-learning portfolios across 3-, 30-, and 100-stock universes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "gymnasium>=1.0,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "psutil>=6,<8",
  "pyyaml>=6.0,<7",
  "scipy>=1.13,<2",
  "sbx-rl==0.28.0",
  "jax==0.11.2",
  "jaxlib==0.11.2",
  "flax==0.12.9",
  "optax==0.2.8",
  "tfp-nightly==0.26.0.dev20260921",
  "stable-baselines3==2.9.0",
  "tensorboard>=2.18,<3",
  "tabulate>=0.9,<1",
  "tqdm>=4.67,<5",
  "typer>=0.12,<1",
  "yfinance==0.2.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]
notebook = [
  "ipykernel>=6,<8",
  "jupyter>=1,<2",
  "nbconvert>=7,<8",
]

[project.scripts]
dtasrl = "dtasrl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtasrl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
